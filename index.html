<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DexoDev</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --neon-cyan: #00f5ff;
      --neon-pink: #ff2d78;
      --neon-yellow: #ffe600;
      --bg: #05080f;
      --bg2: #0a0e1a;
      --card: #0d1221;
      --border: rgba(0,245,255,0.15);
      --text: #c8d8e8;
      --dim: #5a7a8a;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Scanlines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* Radial glow */
    .glow-bg {
      position: fixed;
      width: 700px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,245,255,0.07) 0%, rgba(0,150,200,0.04) 40%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Main layout */
    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      gap: 0;
    }

    /* Tag */
    .logo-tag {
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 6px 16px;
      margin-bottom: 28px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(0,245,255,0.2), inset 0 0 12px rgba(0,245,255,0.05);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.2s, flicker 7s infinite 2s;
    }

    @keyframes flicker {
      0%, 94%, 100% { opacity: 1; }
      95% { opacity: 0.5; }
      97% { opacity: 1; }
      99% { opacity: 0.3; }
    }

    /* Name */
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(3rem, 9vw, 6.5rem);
      line-height: 1;
      letter-spacing: -1px;
      color: #fff;
      text-shadow:
        0 0 20px rgba(0,245,255,0.7),
        0 0 60px rgba(0,245,255,0.3),
        0 0 120px rgba(0,245,255,0.15);
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.4s;
    }

    h1 span { color: var(--neon-cyan); }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 200px;
      margin: 0 auto 20px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.6s;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      opacity: 0.4;
    }
    .divider-dot {
      width: 6px;
      height: 6px;
      background: var(--neon-cyan);
      transform: rotate(45deg);
      box-shadow: 0 0 8px var(--neon-cyan);
    }

    /* Subtitle */
    .subtitle {
      font-size: clamp(0.7rem, 1.6vw, 0.85rem);
      color: var(--dim);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.8s;
    }

    /* Game card */
    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 28px 36px;
      display: flex;
      align-items: center;
      gap: 28px;
      max-width: 480px;
      width: 100%;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.3s;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1s;
      text-decoration: none;
      cursor: pointer;
    }

    .game-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,245,255,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .game-card:hover {
      border-color: rgba(0,245,255,0.4);
      transform: translateY(-3px);
    }

    .game-card:hover .card-arrow {
      transform: translateX(4px);
      color: #fff;
    }

    .game-icon {
      width: 56px;
      height: 56px;
      background: rgba(0,245,255,0.08);
      border: 1px solid rgba(0,245,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }

    .card-content {
      text-align: left;
      flex: 1;
    }

    .card-label {
      font-size: 9px;
      color: var(--neon-cyan);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-family: 'Orbitron', sans-serif;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .card-desc {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 1px;
    }

    .card-arrow {
      color: var(--neon-cyan);
      font-size: 18px;
      transition: transform 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    /* Status row */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.2s;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--neon-cyan);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .status-text {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Footer nav */
    .footer-nav {
      position: fixed;
      bottom: 28px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 32px;
      z-index: 2;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.4s;
    }

    .footer-nav a {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s;
      border: none;
    }

    .footer-nav a:hover {
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>

  <div class="container">
    <div class="logo-tag">Solo Indie Dev</div>

    <h1>Dexo<span>Dev</span></h1>

    <div class="divider"><div class="divider-dot"></div></div>

    <p class="subtitle">Building clean, focused mobile experiences</p>

    <a class="game-card" href="https://play.google.com/store/apps/details?id=com.dexodev.cyberbounce" target="_blank">
      <div class="game-icon">👾</div>
      <div class="card-content">
        <div class="card-label">Latest Release</div>
        <div class="card-title">CyberBounce</div>
        <div class="card-desc">Arcade ball shooter · Free on Google Play</div>
      </div>
      <div class="card-arrow">→</div>
    </a>

    <div class="status-row">
      <div class="status-dot"></div>
      <span class="status-text">Active Development</span>
    </div>
  </div>

  <nav class="footer-nav">
    <a href="mailto:abdellahtiznit1971@gmail.com">Contact</a>
    <a href="/privacy-policy">Privacy Policy</a>
  </nav>

</body>
</html>
