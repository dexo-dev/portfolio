<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DexoDev</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #07111e;
      color: #e8f4f8;
      font-family: 'DM Sans', sans-serif;
    }

    /* Film grain noise */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.055'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial glow behind title */
    .glow-bg {
      position: fixed;
      width: 700px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(80,200,240,0.10) 0%, rgba(40,120,180,0.06) 40%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 0.7; transform: translate(-50%, -50%) scale(1.08); }
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      gap: 1.4rem;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 1;
      letter-spacing: -0.02em;
      color: #d8f0f8;
      text-shadow:
        0 0 20px rgba(150, 220, 255, 0.9),
        0 0 50px rgba(100, 190, 240, 0.6),
        0 0 100px rgba(60, 150, 220, 0.35),
        0 0 200px rgba(40, 120, 200, 0.2);
      opacity: 0;
      animation: fadeIn 1.2s ease forwards 0.3s;
    }

    .subtitle {
      font-size: clamp(0.8rem, 1.8vw, 0.95rem);
      font-weight: 300;
      color: rgba(180, 215, 235, 0.5);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1s ease forwards 0.9s;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(100,200,255,0.5), transparent);
      opacity: 0;
      animation: fadeIn 1s ease forwards 0.7s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  <div class="container">
    <h1>DexoDev</h1>
    <div class="divider"></div>
    <p class="subtitle">Building clean, focused mobile experiences</p>
  </div>
</body>
</html>
