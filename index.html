<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dexodev</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #080808;
      --fg: #f0f0f0;
      --accent: #c8ff00;
      --muted: #555;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
    }

    /* subtle noise grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 0;
    }

    /* glow blob */
    body::after {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,255,0,0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      gap: 1.2rem;
    }

    .tag {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.2s;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(3.5rem, 12vw, 8rem);
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--fg);
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.4s;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      font-size: clamp(0.85rem, 2vw, 1rem);
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.02em;
      max-width: 320px;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.65s;
    }

    .divider {
      width: 32px;
      height: 1px;
      background: var(--accent);
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.55s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="tag">Independent Developer</p>
    <h1>dexo<span>dev</span></h1>
    <div class="divider"></div>
    <p class="subtitle">Building clean, focused mobile experiences — one app at a time.</p>
  </div>
</body>
</html>
